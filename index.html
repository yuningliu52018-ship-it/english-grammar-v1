<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="English"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>文法真題辨識訓練 V1｜Day 1</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="app-shell"><header class="hero"><div class="eyebrow">116 會考英文｜Day 1</div><h1>英文文法真題辨識訓練 <span>V1</span></h1><p>動詞系統・5 題</p></header>
<section id="startScreen" class="panel start-panel"><div class="mascot">🎮</div><h2>今天只練一件事</h2><p class="big-copy">看到題目包裝，<strong>5 秒認出考點</strong>。</p><p>每題先自己選。卡住時再打開研磨漫畫提示與文法指紋。</p><button id="startBtn" class="primary">開始 5 題挑戰</button><p class="source-note">題目取自你上傳的歷屆國中教育會考題／康軒整理。</p></section>
<section id="quizScreen" class="quiz hidden" aria-live="polite"><div class="topbar"><div><span id="topicTag" class="topic-tag"></span><strong id="counter"></strong></div><div id="scoreMini" class="score-mini">✓ 0</div></div><div class="progress"><div id="progressBar"></div></div>
<article class="question-card"><div class="source-row"><span>① 真題</span><small id="source"></small></div><p id="question" class="question"></p><div id="choices" class="choices"></div></article>
<button id="hintBtn" class="secondary wide" aria-expanded="false" aria-controls="hintPanel">👀 看研磨漫畫提示</button><section id="hintPanel" class="reveal-card hidden"><div class="section-title">② 漫畫圖解</div><img id="hintImage" alt="研磨演出這一題句意的漫畫" loading="lazy"><p id="sceneCaption" class="scene-caption"></p></section>
<button id="fingerprintBtn" class="secondary wide hidden">🧬 看文法指紋</button><section id="fingerprintPanel" class="reveal-card hidden"><div class="section-title blue">③ 文法指紋</div><div id="fingerprint" class="fingerprint"></div></section>
<button id="fiveSecBtn" class="secondary wide hidden">⚡ 5 秒辨識</button><section id="fiveSecPanel" class="reveal-card hidden"><div class="section-title green">④ 5 秒辨識</div><div id="fiveSec" class="steps"></div></section>
<section id="resultPanel" class="result-card hidden"><div class="section-title orange">⑤ 答案</div><div id="resultTitle" class="result-title"></div><p id="resultExplain"></p><div class="one-line"><b>一句白話：</b><span id="oneLine"></span></div></section><button id="nextBtn" class="primary wide hidden">下一題 →</button></section>
<section id="finishScreen" class="panel finish hidden"><div class="finish-icon">🏆</div><h2>Day 1 完成</h2><div id="finalScore" class="final-score"></div><p id="finalMessage"></p><div id="reviewList" class="review-list"></div><button id="retryBtn" class="primary">再做一次</button></section></main><script src="app.js"></script></body></html>
